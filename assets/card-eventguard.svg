<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" fill="none">
<defs>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="0.5" stop-color="#818cf8"/>
    <stop offset="1" stop-color="#e879f9"/>
  </linearGradient>
  <linearGradient id="auroraMove" x1="0" y1="0" x2="2" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="0.33" stop-color="#818cf8"/>
    <stop offset="0.66" stop-color="#e879f9"/>
    <stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#161b22" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#0d1117" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="spin" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#e879f9" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur40" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter><clipPath id="clip"><rect x="1" y="1" width="578" height="248" rx="18"/></clipPath></defs>
<style>
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  @keyframes floatS { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes ping { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(2.6); opacity: 0 } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-20px) } }
  @keyframes dash { to { stroke-dashoffset: 0 } }
  @keyframes sweep { 0% { transform: translateX(-30%) } 100% { transform: translateX(130%) } }
  .float { animation: float 6s ease-in-out infinite; }
  .floatS { animation: floatS 4s ease-in-out infinite; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fadeIn 1.2s ease both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .drift { animation: drift 14s ease-in-out infinite; }</style>

  
  <rect x="1" y="1" width="578" height="248" rx="18" fill="url(#glass)" stroke="#30363d"/>
  <rect x="1" y="1" width="578" height="248" rx="18" fill="none" stroke="url(#aurora)" stroke-width="1.6" stroke-linecap="round"
      stroke-dasharray="266 1394" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="1660" to="0" dur="9s" repeatCount="indefinite"/>
    </rect>
  <g clip-path="url(#clip)"><circle cx="520" cy="40" r="110" fill="#e879f9" opacity="0.10" filter="url(#blur40)"/></g>
  <g class="rise">
    <rect x="30" y="30" width="141" height="24" rx="12" fill="#e879f9" fill-opacity="0.1" stroke="#e879f9" stroke-opacity="0.4"/>
    <text x="41" y="46" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.5" fill="#e879f9">EVENT STREAMING</text>
    <text x="30" y="98" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#e6edf3">EventGuard</text>
    <text font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#8b949e"><tspan x="30" y="130">Idempotent payment pipeline — exactly-once</tspan><tspan x="30" y="152">effects over at-least-once delivery.</tspan></text>
  </g>
  <g class="floatS" style="animation-delay:-1.6s;animation-duration:6s"><polygon points="418,144 470,170 470,180 418,154" fill="#46244b" stroke="#e879f9" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="470,170 522,144 522,154 470,180" fill="#2e1832" stroke="#e879f9" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="470,118 522,144 470,170 418,144" fill="#804389" stroke="#e879f9" stroke-width="0.8" stroke-linejoin="round"/></g><g class="floatS" style="animation-delay:-0.8s;animation-duration:5s"><polygon points="418,118 470,144 470,154 418,128" fill="#46244b" stroke="#e879f9" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="470,144 522,118 522,128 470,154" fill="#2e1832" stroke="#e879f9" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="470,92 522,118 470,144 418,118" fill="#743d7d" stroke="#e879f9" stroke-width="0.8" stroke-linejoin="round"/></g><g class="floatS" style="animation-delay:-0s;animation-duration:4s"><polygon points="418,92 470,118 470,128 418,102" fill="#46244b" stroke="#e879f9" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="470,118 522,92 522,102 470,128" fill="#2e1832" stroke="#e879f9" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="470,66 522,92 470,118 418,92" fill="#c567d4" stroke="#e879f9" stroke-width="1.2" stroke-linejoin="round"/></g>
  <text x="470" y="196" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">DELIVERY</text>
  <text x="470" y="222" text-anchor="middle" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#e879f9">1×</text>
  <g transform="translate(30 188)"><rect width="57" height="28" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="28.5" y="18.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#e6edf3">Kafka</text></g><g transform="translate(95 188)"><rect width="99" height="28" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="49.5" y="18.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#e6edf3">Idempotency</text></g><g transform="translate(202 188)"><rect width="78" height="28" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="39" y="18.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#e6edf3">Payments</text></g>
</svg>
