<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" fill="none">
<defs>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="0.5" stop-color="#818cf8"/>
    <stop offset="1" stop-color="#e879f9"/>
  </linearGradient>
  <linearGradient id="auroraMove" x1="0" y1="0" x2="2" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="0.33" stop-color="#818cf8"/>
    <stop offset="0.66" stop-color="#e879f9"/>
    <stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#161b22" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#0d1117" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="spin" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#e879f9" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur40" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter></defs>
<style>
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  @keyframes floatS { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes ping { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(2.6); opacity: 0 } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-20px) } }
  @keyframes dash { to { stroke-dashoffset: 0 } }
  @keyframes sweep { 0% { transform: translateX(-30%) } 100% { transform: translateX(130%) } }
  .float { animation: float 6s ease-in-out infinite; }
  .floatS { animation: floatS 4s ease-in-out infinite; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fadeIn 1.2s ease both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .drift { animation: drift 14s ease-in-out infinite; }@keyframes sw { from { transform: translateX(-60px) } to { transform: translateX(130px) } } .sw { animation: sw 2.6s ease-in-out infinite alternate; }</style>

  <text x="600" y="24" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="4" fill="#818cf8">02 / TOOLKIT</text>
  <text x="600" y="62" text-anchor="middle" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#e6edf3">The Stack, Layer by Layer</text>
  <rect x="540" y="76" width="120" height="3" rx="1.5" fill="url(#aurora)" opacity="0.35"/>
  <clipPath id="u"><rect x="540" y="76" width="120" height="3" rx="1.5"/></clipPath>
  <g clip-path="url(#u)"><rect class="sw" x="540" y="76" width="50" height="3" fill="url(#aurora)"/></g>
  <text x="600" y="97" text-anchor="middle" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">From cloud infrastructure up to the UI</text>
</svg>
