  @keyframes cycle { 0% { opacity:0; transform: translateY(8px) } 3% { opacity:1; transform: translateY(0) } 22% { opacity:1; transform: translateY(0) } 25% { opacity:0; transform: translateY(-8px) } 100% { opacity:0 } }
